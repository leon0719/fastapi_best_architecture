# Host nginx 站台設定範例(反向代理到只綁 127.0.0.1 的 app 容器)。
#
# 套用(在主機上,需要 sudo,由人執行):
#   1. 把 api.example.com、憑證路徑、APP_PORT(8000)、/admin 白名單換成實際值
#   2. sudo cp nginx/app.conf /etc/nginx/sites-available/app
#      sudo ln -sf /etc/nginx/sites-available/app /etc/nginx/sites-enabled/app
#      sudo nginx -t && sudo systemctl reload nginx
# 改完先跑 `make nginx-check`(用 docker 的 nginx -t 驗語法)。
#
# 變數名加 app_ 前綴:sites-enabled 底下所有站台共用同一個 http context,不加前綴會和其他站台撞名。

# 只有 Upgrade header 時才送 Connection: upgrade(WebSocket/SSE 用;一般請求保持 keep-alive)
map $http_upgrade $app_connection_upgrade {
    default upgrade;
    ""      "";
}

# HTTP 一律轉 HTTPS(Let's Encrypt HTTP-01 驗證路徑例外)
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;  # nginx 1.25.1+ 語法;更舊的版本改成 `listen 443 ssl http2;`
    server_name api.example.com;

    ssl_certificate     /etc/ssl/app/fullchain.pem;
    ssl_certificate_key /etc/ssl/app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:app_ssl:10m;
    ssl_session_timeout 1d;

    # 不在回應洩漏 nginx 版本
    server_tokens off;

    # 安全 header(always:錯誤回應也要帶)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上傳上限:比 app 的 STORAGE_MAX_UPLOAD_MB(預設 10 MB)略大,讓 app 回 400 BaseResponse 而不是 nginx 的 413 HTML
    client_max_body_size 12m;

    # 與其他站台分開,排查時不必在共用的 access.log 裡撈
    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log;

    # 前端回報問題用:沿用 client 帶來的 X-Request-ID,沒有就用 nginx 的 $request_id(app 端會驗格式)
    set $app_request_id $http_x_request_id;
    if ($app_request_id = "") {
        set $app_request_id $request_id;
    }

    # 後台獨立一段:可加 IP 白名單、較嚴的限制。^~ 讓 /admin/statics/... 也套用。
    location ^~ /admin {
        # allow 203.0.113.10;   # 公司對外 IP
        # deny all;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $app_request_id;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $app_connection_upgrade;
        proxy_set_header Host              $host;
        # app 的 client_ip() 讀 X-Real-IP(rate limit、稽核 IP):一定要以 $remote_addr 覆寫,不能沿用 client 送來的值
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $app_request_id;
        proxy_read_timeout 60s;
    }
}

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# 最小權限:預設唯讀,需要更多的 step 自行 opt-in。
permissions:
  contents: read

# 同一個 ref 有新 push 時取消舊的 run,省 runner。
# 只取消 PR 的 run:main 上的 run 可能正在部署,取消會留下半完成的部署。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy .

      # 覆蓋率門檻刻意設在略低於現況(76%)的位置,讓它擋住「新程式碼完全沒測試」
      # 而不是一啟用就紅。補完測試後往上調。
      - name: Tests
        run: uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=70

  # 對真實 Postgres + Redis 跑,並驗證 alembic migration 真的套得上去 ——
  # autogenerate 出來的 migration 沒跑過就 merge 是最常見的上線爆炸點。
  tests-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "true"
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      # compose 的 redis 有 requirepass,CI 這台沒有 → 留空字串連線。
      REDIS_PASSWORD: ""
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Alembic migrations apply cleanly
        run: uv run alembic upgrade head

      - name: Migrations match models (no un-generated changes)
        # autogenerate 若還產得出東西,代表有人改了 model 卻沒建 migration。
        run: |
          uv run alembic revision --autogenerate -m ci-drift-check --rev-id ci_drift_check
          generated="alembic/versions/ci_drift_check_ci_drift_check.py"
          if [ ! -f "$generated" ]; then
            generated="$(ls alembic/versions/ci_drift_check*.py 2>/dev/null | head -1)"
          fi
          if grep -qE '^\s+op\.' "$generated"; then
            echo "偵測到 model 與 migration 不同步,以下是遺漏的變更:"
            cat "$generated"
            exit 1
          fi
          echo "migration 與 model 一致"
          rm -f "$generated"

      - name: Tests
        run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # 掃 uv.lock 鎖定的那組依賴,而非 pyproject 的版本範圍。
      - name: Export locked requirements
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements-audit.txt

      - name: pip-audit
        run: uvx pip-audit --disable-pip -r requirements-audit.txt

  # 靜態掃描程式碼本身的常見弱點模式(SQL/命令注入、硬編碼密碼、不安全的 deserialize 等),
  # 跟 pip-audit(掃第三方套件已知 CVE)、gitleaks(掃機密字串)是互補的三層防線。
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: bandit
        run: uvx bandit -r app -ll

  # 2026-07 的 .env 外洩(見 docs/security-incident-2026-07.md)靠人工 review 沒攔下來。
  # gitleaks 掃「工作目錄 + 完整 git 歷史」,是那次事故對應的自動化防線。
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # gitleaks 要掃歷史,不能用 shallow clone

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml \
            --redact --verbose --exit-code 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: app:ci
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 只擋「有修法可套用」的 CRITICAL,避免上游還沒修的 CVE 卡死所有建置。
      - name: Trivy image scan
        # Pinned by commit SHA, not tag: upstream has deleted/retagged release tags
        # before (the old 0.28.0 pin now fails with "unable to find version").
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # 用 DEBUG=false 起,順便驗證 enforce_secure_settings() 在填妥機密時放行。
      # 不連 DB/Redis:/health/live 是純程序層級的檢查。
      - name: Smoke test /health/live
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DEBUG=false \
            -e ADMIN_SECRET_KEY="ci-smoke-only-not-a-real-secret-0123456789abcdef" \
            -e ADMIN_USERNAME="ci-admin" \
            -e ADMIN_PASSWORD="ci-smoke-only-password" \
            -e DB_PASSWORD="ci-smoke-only-db-password" \
            -e REDIS_PASSWORD="ci-smoke-only-redis-password" \
            -e CORS_ORIGINS="https://app.example.com" \
            app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/live; then
              echo "smoke test passed"
              exit 0
            fi
            sleep 2
          done
          echo "smoke test FAILED — container logs:"
          docker logs smoke
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  # nginx 站台設定的語法檢查(與 make nginx-check 相同);主機上的套用需要 sudo,由人執行。
  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: nginx -t
        run: make nginx-check

  # CD:CI 全過、push 到預設分支才跑。模板預設不部署:到 repo 的 Settings → Variables 設
  # DEPLOY_ENABLED=true 才啟用,並設好下列 secrets / variables(見 docs/deployment.md):
  #   secrets.DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_HOST_FINGERPRINT(主機 SSH 指紋,防中間人)
  #   vars.DEPLOY_PATH(主機上的 repo 路徑)、vars.DEPLOY_APP_PORT(預設 8000)
  deploy:
    needs: [quality, tests-integration, audit, sast, secrets, docker, nginx]
    if: >-
      github.event_name == 'push'
      && github.ref_name == github.event.repository.default_branch
      && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # 同時只跑一個部署,且不取消進行中的部署(避免兩個 job 同時 git pull + up 互相打架)
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - name: SSH, pull and deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          APP_PORT: ${{ vars.DEPLOY_APP_PORT || '8000' }}
          BRANCH: ${{ github.ref_name }}
          HEALTH_RETRIES: "30"
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: DEPLOY_PATH,APP_PORT,BRANCH,HEALTH_RETRIES
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
            # 備份 → build → migrate → up(prod-deploy 內 prod-backup 只跑一次,失敗就中止)
            make prod-deploy

            # 輪詢 readiness(DB + Redis 都通才算),最多 HEALTH_RETRIES 次 × 5 秒
            for i in $(seq 1 "$HEALTH_RETRIES"); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/health/ready" > /dev/null; then
                echo "deploy OK (attempt $i)"
                exit 0
              fi
              sleep 5
            done
            echo "health check FAILED — app logs:"
            docker logs --tail 100 fastapi-best-architecture
            exit 1
